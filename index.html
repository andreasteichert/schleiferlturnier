const INITIAL_IDS=['A','B'].flatMap(g=>Array.from({length:6},(_,i)=>g+(i+1)));
const KEY='familientennis-v2:'+location.pathname;
const fresh=()=>({version:4,teams:Object.fromEntries(INITIAL_IDS.map(id=>[id,{child:'',adult:'',name:''}])),teamsLocked:false,scores:{},drafts:{},round:0,bounce:1,startTime:'',awards:{fair:'',fun:''},timer:{remaining:600,end:null,mode:'Spielzeit'}});
let state=fresh(),view='games',storageOK=true,toastTimeout,audioContext;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function teamIds(group,teams=state.teams){return Object.keys(teams).filter(id=>!group||id[0]===group).sort((a,b)=>a[0].localeCompare(b[0])||Number(a.slice(1))-Number(b.slice(1)));}
function groupSchedule(group,teams=state.teams){const ids=teamIds(group,teams),list=[...ids];if(list.length%2)list.push(null);if(list.length<2)return[];const rounds=[];for(let r=0;r<list.length-1;r++){const pairs=[];for(let i=0;i<list.length/2;i++){const a=list[i],b=list[list.length-1-i];if(a&&b)pairs.push([a,b]);}rounds.push(pairs);list.splice(1,0,list.pop());}return rounds;}
function roundCount(teams=state.teams){return Math.max(...['A','B'].map(g=>groupSchedule(g,teams).length),1);}
function fieldCount(teams=state.teams){return ['A','B'].reduce((n,g)=>n+Math.floor(teamIds(g,teams).length/2),0);}
function matchList(round,teams=state.teams){const schedules=['A','B'].map(g=>groupSchedule(g,teams)),aFields=Math.floor(teamIds('A',teams).length/2);return ['A','B'].flatMap((g,gi)=>(schedules[gi][round]||[]).map(([a,b],i)=>({id:`${round}-${g}-${i}`,a,b,field:(gi?aFields:0)+i+1})));}
function allMatches(teams=state.teams){return Array.from({length:roundCount(teams)},(_,r)=>matchList(r,teams)).flat();}
function totalMatches(teams=state.teams){return allMatches(teams).length;}
function gamesPerTeam(id,teams=state.teams){return Math.max(0,teamIds(id[0],teams).length-1);}
function isScore(s){return Array.isArray(s)&&s.length===2&&s.every(n=>Number.isInteger(n)&&n>=0&&n<=999);}
function totalDone(){return Object.keys(state.scores).length;}
function teamText(id){const t=state.teams[id];return t.name||[t.child||'Kind',t.adult||'Erwachsene Person'].join(' & ');}
function toast(s){$('#toast').textContent=s;clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>$('#toast').textContent='',3800);}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;$('#save-status').textContent='Auf diesem Gerät gespeichert';}catch{storageOK=false;$('#save-status').textContent='Bitte Sicherung herunterladen';} }
function render(){document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-current',b.dataset.view===view?'page':'false')});$('#main').innerHTML=`${!storageOK?'<div class="warning">Dein Browser kann gerade nicht speichern. Lass diese Seite geöffnet und lade regelmäßig unter „Sicherung“ eine Sicherungsdatei herunter.</div>':''}`+({games:renderGames,teams:renderTeams,standings:renderStandings,rules:renderRules}[view])();({games:bindGames,teams:bindTeams,standings:bindStandings,rules:bindRules}[view])();updateTimer();}
function renderGames(){let matches=matchList(state.round),scores=state.scores,done=matches.filter(m=>scores[m.id]).length,total=matches.length;return `<div class="intro"><div><div class="eyebrow">${teamIds().length*2} Menschen. ${teamIds().length} Teams. Ein schöner Tag.</div><h2>Alle auf die Plätze!</h2></div><span class="muted">${fieldCount()} Kleinfelder · Kind + Erwachsener</span></div><div class="control-deck"><section class="panel"><div class="section-heading"><h3>Welche Runde spielt ihr?</h3><span class="small muted">${totalDone()} / ${totalMatches()} Spiele</span></div><div class="rounds" aria-label="Runde auswählen">${Array.from({length:roundCount()},(_,r)=>`<button data-round="${r}" class="${r===state.round?'active':''}" aria-pressed="${r===state.round}">${r+1}</button>`).join('')}</div><div class="progress-track" role="progressbar" aria-label="Ergebnisse dieser Runde" aria-valuenow="${done}" aria-valuemin="0" aria-valuemax="${total}"><div class="progress-fill" style="width:${total?done/total*100:0}%"></div></div><p class="small muted">${done===total?`Alle ${total} Ergebnisse sind eingetragen.`:`${done} von ${total} Ergebnissen in dieser Runde eingetragen.`}</p></section><section class="panel timer"><div class="timer-top"><h3 id="timer-label">${state.timer.mode}</h3><span class="small muted" id="timer-status">Gemeinsam starten</span></div><div class="timer-digits" id="timer-digits">10:00</div><div class="timer-actions"><button class="light" id="timer-toggle">Start</button><button class="ghost" id="timer-reset" aria-label="Timer zurücksetzen">↺</button></div></section></div><div class="section-heading"><h3>Runde ${state.round+1} <span class="muted small">· 10 Minuten</span></h3><button class="ghost small" id="break-timer">2 Min. Wechselpause</button></div><div class="games">${matches.map(m=>matchCard(m,scores[m.id])).join('')}</div><p class="hint">Einzelne Ballwechsel zählen, z. B. 18 : 14. Nach dem Schlusssignal den laufenden Ballwechsel beenden. Beide Teams bestätigen das Ergebnis. Für die Tabelle zählen zuerst Sieg/Unentschieden, danach die insgesamt gewonnenen Ballwechselpunkte.</p><div class="screen-footer"><span>Alles bleibt auf diesem Gerät. Unter „Sicherung“ könnt ihr euren Stand herunterladen.</span><span>Fair spielen. Gemeinsam Spaß haben.</span></div>`;}
function matchCard(m,score){const draft=state.drafts[m.id],values=draft||score,clean=score&&!draft;return `<article class="match ${clean?'saved':''}" data-match="${m.id}"><div class="match-top"><span class="court-label">FELD ${m.field}</span><span class="tag ${m.a[0]==='B'?'b':''}">Gruppe ${m.a[0]}</span></div><div class="teams-pair">${[m.a,m.b].map(id=>`<div><div class="team-code">${id}</div><div class="team-name">${esc(teamText(id))}</div></div>`).join('')}</div><div class="score-row"><input aria-label="Punkte ${m.a}, Feld ${m.field}" type="number" inputmode="numeric" min="0" max="999" step="1" placeholder="–" value="${esc(values?.[0]??'')}" data-side="0"><span class="colon">:</span><input aria-label="Punkte ${m.b}, Feld ${m.field}" type="number" inputmode="numeric" min="0" max="999" step="1" placeholder="–" value="${esc(values?.[1]??'')}" data-side="1"></div><button class="save-score ${clean?'':'primary'}" data-save="${m.id}">${clean?'✓ Ergebnis gespeichert':draft?'Ergebnis bestätigen':'Ergebnis speichern'}</button>${score?`<button class="ghost small" style="width:100%;margin-top:8px" data-clear="${m.id}">Ergebnis löschen</button>`:''}</article>`;}
function showDialog(title,body,setup){const d=$('#dialog');d.innerHTML=`<h2 id="dialog-title">${title}</h2>${body}`;d.showModal();setup?.(d);}
function ask(title,body,label='Bestätigen'){return new Promise(resolve=>{showDialog(title,`<p>${body}</p><div class="dialog-actions"><button class="ghost" id="cancel-dialog">Abbrechen</button><button class="primary" id="confirm-dialog">${label}</button></div>`,d=>{let ok=false;d.addEventListener('close',()=>resolve(ok),{once:true});$('#cancel-dialog').onclick=()=>d.close();$('#confirm-dialog').onclick=()=>{ok=true;d.close()};});});}
async function saveScore(id,values){const matches=allMatches();if(!matches.some(m=>m.id===id)||!isScore(values))throw new Error('Bitte zwei ganze Punktzahlen von 0 bis 999 eingeben.');state.scores[id]=values;state.teamsLocked=true;delete state.drafts[id];persist();render();toast('Ergebnis gespeichert. Teamänderungen sind für dieses Turnier jetzt gesperrt.');return true;}

function stats(group){const rows=teamIds(group).map(id=>({id,played:0,won:0,draw:0,matchPoints:0,ballpoints:0})),lookup=Object.fromEntries(rows.map(r=>[r.id,r]));for(let r=0;r<roundCount();r++)for(const m of matchList(r)){const s=state.scores[m.id];if(!s||m.a[0]!==group)continue;const a=lookup[m.a],b=lookup[m.b];a.played++;b.played++;a.ballpoints+=s[0];b.ballpoints+=s[1];if(s[0]===s[1]){a.draw++;b.draw++;a.matchPoints++;b.matchPoints++;}else{const w=s[0]>s[1]?a:b;w.won++;w.matchPoints+=2;}}rows.sort((a,b)=>b.matchPoints-a.matchPoints||b.ballpoints-a.ballpoints);rows.forEach(r=>{r.rank=r.played?1+rows.filter(o=>o.played&&(o.matchPoints>r.matchPoints||(o.matchPoints===r.matchPoints&&o.ballpoints>r.ballpoints))).length:null;r.shared=!!r.played&&rows.filter(o=>o.played&&o.matchPoints===r.matchPoints&&o.ballpoints===r.ballpoints).length>1;});return rows;}

function validateData(raw){

function readDrafts(obj,allowed){const result={};for(const [id,v] of Object.entries(obj||{})){if(!allowed.has(id)||!Array.isArray(v)||v.length!==2||!v.every(s=>typeof s==='string'&&s.length<=20&&/^[0-9.eE+\-]*$/.test(s)))throw new Error('Ungültige Ergebniseingabe.');result[id]=[...v]}return result;}
out.drafts=readDrafts(raw.drafts,validMatchIds);
if(!Number.isInteger(raw.round)||raw.round<0||raw.round>=roundCount(out.teams)||![1,2].includes(raw.bounce)||!str(raw.startTime,5)||(raw.startTime&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(raw.startTime)))throw new Error('Ungültige Turniereinstellungen.');out.round=raw.round;out.bounce=raw.bounce;out.startTime=raw.startTime;

}
function firstMatchFor(id){for(let r=0;r<roundCount();r++){const match=matchList(r).find(m=>m.a===id||m.b===id);if(match)return{round:r+1,field:match.field};}return null;}
function printExtras(kind){let html='';if(kind==='cards'){for(const role of ['Kinderlos','Erwachsenenlos'])for(const group of ['A','B']){const ids=teamIds(group);for(let page=0;page<ids.length;page+=6){const chunk=ids.slice(page,page+6);html+=`<section class="print-sheet"><h1>${role==='Kinderlos'?'Kinder':'Erwachsene'} · Gruppe ${group}</h1><p>Einseitig bei 100 % drucken und ausschneiden. Kinderlose und Erwachsenenlose separat mischen. Gleiches Kürzel = ein Team.</p><div class="los-grid">${chunk.map(id=>{const first=firstMatchFor(id);return `<div class="los-card"><span>${role.toUpperCase()} / GRUPPE ${group}</span><strong>TEAM ${id}</strong><p>Erster Einsatz: Runde ${first.round}, Feld ${first.field}</p><p>Name: ________________________</p></div>`}).join('')}</div></section>`;}}}else{const aFields=Math.floor(teamIds('A').length/2);for(let field=1;field<=fieldCount();field++){const group=field<=aFields?'A':'B';html+=`<section class="print-sheet print-field"><p>SAISONABSCHLUSS TURNIER · SV SALLACH</p><h1>FELD ${field}</h1><h2>Gruppe ${group}</h2><p>10 Minuten spielen · 2 Minuten wechseln</p><table><thead><tr><th>Runde</th><th>Diese Teams spielen hier</th></tr></thead><tbody>${Array.from({length:roundCount()},(_,r)=>{const m=matchList(r).find(m=>m.field===field);return `<tr><td>${r+1}</td><td>${m?`${m.a} gegen ${m.b}`:'Feld frei'}</td></tr>`}).join('')}</tbody></table><p>Nach ${roundCount()} Runden steht die Platzierung über Matchpunkte und Ballwechselpunkte fest.</p></section>`;}}$('#print-extra').innerHTML=html;document.body.classList.add('printing-extra');window.print();}
window.addEventListener('afterprint',()=>{document.body.classList.remove('printing-extra');$('#print-extra').innerHTML='';});
function downloadBackup(){const data=JSON.stringify(state,null,2),url=URL.createObjectURL(new Blob([data],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=`Familienturnier-Sicherung-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('Sicherungsdatei zum Herunterladen erstellt.');}
function publicSnapshot(){const team=id=>({id,label:teamText(id)});return{version:1,exportedAt:new Date().toISOString(),title:'Saisonabschluss Turnier',subtitle:'SV Sallach · Familientag',summary:{teams:teamIds().length,rounds:roundCount(),fields:fieldCount(),results:totalDone(),matches:totalMatches()},rounds:Array.from({length:roundCount()},(_,r)=>({number:r+1,matches:matchList(r).map(m=>({id:m.id,field:m.field,a:team(m.a),b:team(m.b),score:state.scores[m.id]||null}))})),standings:overallStats().map(r=>({rank:r.rank,shared:r.shared,id:r.id,label:teamText(r.id),played:r.played,total:gamesPerTeam(r.id),won:r.won,matchPoints:r.matchPoints,wonRallies:r.ballpoints}))};}
function downloadPublicStand(){const data=JSON.stringify(publicSnapshot(),null,2),url=URL.createObjectURL(new Blob([data],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='turnierstand.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('Online-Turnierstand exportiert. Datei turnierstand.json im Repository ersetzen.');}
function resetTournament(){state=fresh();view='teams';releaseWake();persist();render();toast('Neues Turnier erstellt. Die Teamaufstellung ist wieder freigegeben.');}
async function requestNewTournament(){if(!await ask('Wirklich neu beginnen?','Alle Namen, Ergebnisse und Auszeichnungen auf diesem Gerät werden gelöscht. Lade vorher eine Sicherung herunter, wenn du sie behalten möchtest.','Alles zurücksetzen'))return false;resetTournament();return true;}
function confirmNewTournamentInDialog(d){d.innerHTML='<h2 id="dialog-title">Wirklich neu beginnen?</h2><p>Alle Namen, Ergebnisse und Auszeichnungen auf diesem Gerät werden gelöscht. Lade vorher eine Sicherung herunter, wenn du sie behalten möchtest.</p><div class="dialog-actions"><button class="ghost" id="cancel-reset">Abbrechen</button><button class="danger" id="confirm-reset">Alles zurücksetzen</button></div>';$('#cancel-reset').onclick=()=>d.close();$('#confirm-reset').onclick=()=>{d.close();resetTournament()};}
function openBackup(){showDialog('Euren Turnierstand sichern',`<p>Alle Namen, bestätigten Ergebnisse und angefangenen Eingaben bleiben auf diesem Gerät. Für einen Gerätewechsel die Sicherung herunterladen und dort wieder einlesen.</p><div class="backup-actions"><button class="primary" id="export-data">Sicherung herunterladen</button><button class="ghost" id="export-public">Online-Stand exportieren</button><button class="ghost" id="import-data">Sicherung einlesen</button><button class="danger" id="reset-all">Neues Turnier beginnen</button></div><p class="hint">Für die öffentliche Nur-Lese-Seite die erzeugte Datei <strong>turnierstand.json</strong> im Repository ersetzen. Veröffentlicht werden nur Spielplan, bestätigte Ergebnisse und Gesamttabelle – keine Entwürfe oder Gerätesicherung.</p><div class="dialog-actions"><button class="ghost" id="close-backup">Schließen</button></div>`,d=>{$('#export-data').onclick=downloadBackup;$('#export-public').onclick=downloadPublicStand;$('#import-data').onclick=()=>{d.close();$('#import-file').click()};$('#close-backup').onclick=()=>d.close();$('#reset-all').onclick=()=>confirmNewTournamentInDialog(d);});}
$('#import-file').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>500000)throw new Error('Diese Datei ist zu groß für eine Turniersicherung.');const imported=validateData(JSON.parse(await file.text()));if(!await ask('Turnierstand übernehmen?',`Die Datei enthält ${Object.keys(imported.scores).length} bestätigte Gruppenergebnisse. Euer jetziger Stand wird vollständig ersetzt.`,'Sicherung übernehmen'))return;if(imported.timer.end){imported.timer.remaining=Math.max(0,Math.ceil((imported.timer.end-Date.now())/1000));imported.timer.end=null;}state=imported;view='games';releaseWake();persist();render();toast('Sicherung eingelesen. Ein laufender Timer wurde angehalten.');}catch(e){toast(e instanceof SyntaxError?'Die Datei enthält keine gültige Sicherung.':e.message)}};
$('#backup-open').onclick=openBackup;
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});
try{const stored=localStorage.getItem(KEY);if(stored)state=validateData(JSON.parse(stored));}catch{storageOK=false;}
render();setInterval(updateTimer,250);
if(document.modelContext?.registerTool){try{document.modelContext.registerTool({name:'read_tournament',title:'Turnierstand lesen',description:'Liest Teams, bestätigte Ergebnisse und Tabellen des Familienturniers auf diesem Gerät.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},execute:()=>({teams:state.teams,teamsLocked:state.teamsLocked,scores:state.scores,standings:{A:stats('A'),B:stats('B')}})});document.modelContext.registerTool({name:'save_match_result',title:'Spielergebnis bestätigen',description:'Speichert ein bestätigtes Spielergebnis des aktuellen Spielplans und sperrt anschließend die Teamaufstellung.',inputSchema:{type:'object',properties:{matchId:{type:'string'},pointsA:{type:'integer',minimum:0,maximum:999},pointsB:{type:'integer',minimum:0,maximum:999}},required:['matchId','pointsA','pointsB'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:async x=>{if(!x||typeof x.matchId!=='string')throw new Error('Ungültige Begegnung.');return{saved:await saveScore(x.matchId,[x.pointsA,x.pointsB])}}});}catch{}}
</script></body></html>
