<body>
<header><div class="shell"><div class="topbar"><div class="brand"><div class="brandmark" aria-hidden="true">🎾</div><div><h1>Schleiferlturnier</h1><p>Wechselnde Doppel · Erwachsene</p></div></div><div class="actions"><span class="small muted" id="save-status">Auf diesem Gerät</span><button class="ghost" id="backup"><span class="label">Sicherung</span> ↕</button></div></div><nav aria-label="Hauptnavigation"><button class="active" data-view="setup" aria-current="page">Planung</button><button data-view="schedule">Spielplan</button><button data-view="standings">Tabelle</button><button data-view="rules">Ablauf & Regeln</button></nav></div></header>
<div class="shell"><main id="main"></main></div><div id="print-extra" aria-hidden="true"></div><footer class="site-footer"><div class="shell"><span>Schleiferlturnier · Wechselnde Doppel</span><span class="credit">Erstellt von Andreas Teichert</span></div></footer><div class="toast" id="toast" role="status"></div><dialog id="dialog"></dialog><input id="import-file" type="file" accept="application/json,.json" hidden>
<script>
'use strict';
const KEY='schleiferlturnier-v1:'+location.pathname;
const fresh=()=>({version:1,title:'Schleiferlturnier',rounds:5,courts:3,minutes:15,breakMinutes:5,players:[...Array(6)].flatMap((_,i)=>[{id:'A'+(i+1),level:'A',name:''},{id:'B'+(i+1),level:'B',name:''}]),schedule:[],results:{},currentRound:0,timer:{remaining:900,end:null,mode:'Spielzeit'}});
let state=fresh(),view='setup',toastTimer,audioContext,wakeLock;
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const players=level=>state.players.filter(p=>!level||p.level===level);
const player=id=>state.players.find(p=>p.id===id);
const groupName=level=>`Gruppe ${level}`;
const playerColor=id=>{const i=Math.max(0,state.players.findIndex(p=>p.id===id));return `hsl(${Math.round(i*137.508)%360} 62% 42%)`};
const displayName=id=>player(id)?.name.trim()||`${groupName(id[0])} · Person ${id.slice(1)}`;
function toast(text){$('#toast').textContent=text;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').textContent='',3500)}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));$('#save-status').textContent='Gespeichert'}catch{$('#save-status').textContent='Sicherung empfohlen'}}
const timerSeconds=mode=>(mode==='Pause'?state.breakMinutes:state.minutes)*60;
const remaining=()=>state.timer.end?Math.max(0,Math.ceil((state.timer.end-Date.now())/1000)):state.timer.remaining;
const clock=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
function resetTimer(mode='Spielzeit'){state.timer={remaining:timerSeconds(mode),end:null,mode};releaseWake();persist();updateTimer()}
async function requestWake(){try{if('wakeLock'in navigator&&!wakeLock)wakeLock=await navigator.wakeLock.request('screen')}catch{}}
function releaseWake(){try{wakeLock?.release()}catch{}wakeLock=null}
function beep(){try{audioContext??=new(window.AudioContext||window.webkitAudioContext)();const o=audioContext.createOscillator(),g=audioContext.createGain();o.frequency.value=880;g.gain.setValueAtTime(.18,audioContext.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+.8);o.connect(g).connect(audioContext.destination);o.start();o.stop(audioContext.currentTime+.8)}catch{}}
function updateTimer(){if(state.timer.end&&remaining()===0){state.timer.end=null;state.timer.remaining=0;persist();releaseWake();beep();toast(state.timer.mode==='Spielzeit'?'Zeit um! Nur vollständig beendete Spiele zählen.':'Pause beendet. Nächste Runde kann starten.')}const digits=$('#timer-digits');if(!digits)return;const n=remaining();digits.textContent=clock(n);$('#timer-mode').textContent=state.timer.mode;$('#timer-status').textContent=state.timer.end?'Läuft':n===0?'Zeit um':'Bereit';$('#timer-toggle').textContent=state.timer.end?'Pause':n===0?'Neu starten':n===timerSeconds(state.timer.mode)?'Start':'Weiter'}
function toggleTimer(){if(state.timer.end){state.timer.remaining=remaining();state.timer.end=null;releaseWake()}else{if(!state.timer.remaining)state.timer.remaining=timerSeconds(state.timer.mode);state.timer.end=Date.now()+state.timer.remaining*1000;requestWake()}persist();updateTimer()}
function hashSeed(text){let h=2166136261;for(const c of text){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rngFrom(seed){let x=seed||1;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return(x>>>0)/4294967296}}
function shuffled(items,rng=Math.random){const out=[...items];for(let i=out.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
function pairKey(a,b){return[a,b].sort().join('|')}
function generateSchedule(){const groupA=players('A').map(p=>p.id),groupB=players('B').map(p=>p.id),courtCount=Math.min(state.courts,Math.floor(groupA.length/2),Math.floor(groupB.length/2));if(courtCount<1)throw new Error('Es werden mindestens zwei Personen in Gruppe A und zwei Personen in Gruppe B benötigt.');const slots=courtCount*2,appear=Object.fromEntries(state.players.map(p=>[p.id,0])),partners={},opponents={},schedule=[],rng=rngFrom(hashSeed(state.players.map(p=>p.id+':'+p.name).join(',')+state.rounds+':'+state.courts));for(let round=0;round<state.rounds;round++){let best=null;for(let attempt=0;attempt<500;attempt++){const choose=list=>shuffled(list,rng).sort((a,b)=>appear[a]-appear[b]||rng()-.5).slice(0,slots),as=choose(groupA),bs=choose(groupB),available=shuffled(bs,rng),teams=[];for(const a of shuffled(as,rng)){available.sort((x,y)=>(partners[pairKey(a,x)]||0)-(partners[pairKey(a,y)]||0)||rng()-.5);const b=available.shift();teams.push([a,b]);}const teamOrder=shuffled(teams,rng),matches=[];while(teamOrder.length){const t1=teamOrder.shift();teamOrder.sort((x,y)=>matchPenalty(t1,x,opponents)-matchPenalty(t1,y,opponents)||rng()-.5);matches.push([t1,teamOrder.shift()]);}const projected={...appear};for(const id of [...as,...bs])projected[id]++;const values=Object.values(projected),spread=Math.max(...values)-Math.min(...values),partnerRepeats=teams.reduce((n,t)=>n+(partners[pairKey(...t)]||0),0),opponentRepeats=matches.reduce((n,[x,y])=>n+x.flatMap(a=>y.map(b=>opponents[pairKey(a,b)]||0)).reduce((s,v)=>s+v,0),0),score=spread*10000+partnerRepeats*300+opponentRepeats*12+rng();if(!best||score<best.score)best={score,matches,used:new Set([...as,...bs])};}const roundMatches=best.matches.map((teams,i)=>({id:`R${round+1}F${i+1}`,court:i+1,teams}));schedule.push({round:round+1,matches:roundMatches,byes:state.players.map(p=>p.id).filter(id=>!best.used.has(id))});for(const id of best.used)appear[id]++;for(const m of roundMatches){for(const t of m.teams)partners[pairKey(...t)]=(partners[pairKey(...t)]||0)+1;for(const a of m.teams[0])for(const b of m.teams[1])opponents[pairKey(a,b)]=(opponents[pairKey(a,b)]||0)+1;}}return schedule}
function matchPenalty(a,b,opponents){return a.flatMap(x=>b.map(y=>opponents[pairKey(x,y)]||0)).reduce((s,v)=>s+v,0)}
function scheduleStats(){const games=state.schedule.reduce((n,r)=>n+r.matches.length,0),active=Math.min(state.courts,Math.floor(players('A').length/2),Math.floor(players('B').length/2)),playDuration=state.rounds*state.minutes,breakDuration=Math.max(0,state.rounds-1)*state.breakMinutes;return{games,active,playDuration,breakDuration,duration:playDuration+breakDuration}}
function generate(){if(state.schedule.length&&Object.keys(state.results).length&&!confirm('Der vorhandene Spielplan und alle Ergebnisse werden ersetzt. Fortfahren?'))return;try{state.schedule=generateSchedule();state.results={};state.currentRound=0;state.timer={remaining:state.minutes*60,end:null,mode:'Spielzeit'};releaseWake();persist();view='schedule';render();toast('Spielplan erstellt. Die Paarungen wechseln von Runde zu Runde.')}catch(e){toast(e.message)}}
function addPlayer(level){const nums=players(level).map(p=>Number(p.id.slice(1))),n=Math.max(0,...nums)+1;state.players.push({id:level+n,level,name:''});state.schedule=[];state.results={};persist();render()}
function removePlayer(id){if(players(id[0]).length<=2){toast('Pro Kategorie müssen mindestens zwei Personen bleiben.');return}state.players=state.players.filter(p=>p.id!==id);state.schedule=[];state.results={};persist();render()}
function drawPlayers(){if(Object.keys(state.results).length){toast('Nach dem ersten Ergebnis ist eine neue Auslosung erst in einem neuen Turnier möglich.');return}if(state.players.some(p=>!p.name.trim())){toast('Bitte zuerst bei allen Personen einen Namen eintragen.');return}if(state.schedule.length&&!confirm('Die Namen werden innerhalb ihrer Gruppen neu ausgelost und der vorhandene Spielplan wird ersetzt. Fortfahren?'))return;for(const level of ['A','B']){const names=shuffled(players(level).map(p=>p.name));players(level).forEach((p,i)=>p.name=names[i])}state.schedule=[];state.results={};state.currentRound=0;resetTimer();persist();render();toast('Die Namen wurden innerhalb von Gruppe A und Gruppe B digital ausgelost.')}
function renderSetup(){const s=scheduleStats(),possible=Math.min(state.courts,Math.floor(players('A').length/2),Math.floor(players('B').length/2)),locked=Object.keys(state.results).length>0;return `<div class="intro"><div><div class="eyebrow">Turnier vorbereiten</div><h2>Wer spielt mit?</h2></div><span class="muted">Jedes Doppel: Gruppe A + Gruppe B</span></div>${players('A').length!==players('B').length?'<div class="notice">Die Gruppen sind unterschiedlich groß. Das ist möglich; Pausen werden automatisch möglichst gleichmäßig verteilt.</div>':''}${locked?'<div class="notice">Die Auslosung ist gesperrt, weil bereits ein Ergebnis gespeichert wurde. Für eine neue Auslosung bitte ein neues Turnier beginnen.</div>':''}<div class="draw-toolbar"><button class="primary" id="draw-players" ${locked?'disabled':''}>Digital auslosen</button><button class="ghost" id="print-players">Spielerliste drucken</button><button class="ghost" id="print-lots">Loskarten drucken</button></div><p class="print-note">Digital werden die Namen innerhalb ihrer Gruppe gemischt. Für die manuelle Auslosung die farbigen Loskarten getrennt nach Gruppe A und B verwenden.</p><div class="setup-grid"><div class="settings"><section class="panel"><h3>Rahmen</h3><div style="margin-top:16px"><label for="title">Turniername</label><input id="title" maxlength="80" value="${esc(state.title)}"></div><div class="settings-grid" style="margin-top:12px"><div><label for="round-count">Runden</label><input id="round-count" type="number" min="1" max="30" value="${state.rounds}"></div><div><label for="court-count">Felder</label><input id="court-count" type="number" min="1" max="12" value="${state.courts}"></div></div><div class="settings-grid" style="margin-top:12px"><div><label for="minutes">Minuten je Runde</label><input id="minutes" type="number" min="5" max="60" value="${state.minutes}"></div><div><label for="break-minutes">Pausenzeit</label><input id="break-minutes" type="number" min="0" max="60" value="${state.breakMinutes}" aria-describedby="break-hint"><div id="break-hint" class="small muted" style="margin-top:6px">Minuten zwischen den Runden</div></div></div></section><section class="panel summary"><div class="small muted">Mit der aktuellen Besetzung</div><div class="summary-grid"><div class="summary-item"><strong>${possible}</strong><span class="small">Felder gleichzeitig</span></div><div class="summary-item"><strong>${state.rounds}</strong><span class="small">Runden</span></div><div class="summary-item"><strong>${s.duration}</strong><span class="small">Minuten Gesamtdauer</span></div></div><button class="gold" id="generate" style="width:100%">Spielplan erstellen</button></section></div><div class="player-columns">${[['A','Gruppe A'],['B','Gruppe B']].map(([level,label])=>`<section class="panel"><div class="category-head"><div><h3>${label}</h3><span class="pill ${level==='A'?'beginner':'advanced'}">${players(level).length} Personen</span><div class="color-legend">Jede Person behält ihre Farbe.</div></div><button class="ghost icon-btn" data-add="${level}" aria-label="${label} hinzufügen">+</button></div><div class="player-list">${players(level).map((p,i)=>`<div class="player-row"><span class="player-code" style="--player-color:${playerColor(p.id)}">${p.id}</span><input data-player="${p.id}" aria-label="Name ${label} ${i+1}" maxlength="60" placeholder="Name" value="${esc(p.name)}"><button class="danger icon-btn" data-remove="${p.id}" aria-label="${displayName(p.id)} entfernen">×</button></div>`).join('')}</div></section>`).join('')}</div></div><div class="footer-note"><span>Namen und Spielplan bleiben in diesem Browser gespeichert.</span><span>Ungleiche Gruppen werden durch faire Pausen ausgeglichen.</span></div>`}
function bindSetup(){$$('[data-player]').forEach(i=>i.oninput=()=>{player(i.dataset.player).name=i.value;state.schedule=[];state.results={};persist()});$$('[data-add]').forEach(b=>b.onclick=()=>addPlayer(b.dataset.add));$$('[data-remove]').forEach(b=>b.onclick=()=>removePlayer(b.dataset.remove));$('#title').oninput=e=>{state.title=e.target.value;persist()};$('#round-count').onchange=e=>{state.rounds=Math.max(1,Math.min(30,Number(e.target.value)||1));state.schedule=[];state.results={};persist();render()};$('#court-count').onchange=e=>{state.courts=Math.max(1,Math.min(12,Number(e.target.value)||1));state.schedule=[];state.results={};persist();render()};$('#minutes').onchange=e=>{state.minutes=Math.max(5,Math.min(60,Number(e.target.value)||15));resetTimer('Spielzeit');render()};$('#break-minutes').onchange=e=>{state.breakMinutes=Math.max(0,Math.min(60,Number(e.target.value)||0));if(state.timer.mode==='Pause')resetTimer('Pause');else persist();render()};$('#draw-players').onclick=drawPlayers;$('#print-players').onclick=()=>printExtras('players');$('#print-lots').onclick=()=>printExtras('lots');$('#generate').onclick=generate}
function renderSchedule(){if(!state.schedule.length)return empty('Noch kein Spielplan','Trage unter „Planung“ die Teilnehmer ein und erstelle anschließend den Spielplan.','Zur Planung','setup');const s=scheduleStats();return `<div class="intro"><div><div class="eyebrow">${esc(state.title)}</div><h2>Alle Runden im Überblick</h2></div><button class="ghost no-print" onclick="window.print()">Gesamten Spielplan drucken</button></div><section class="timer-panel no-print" aria-label="Turnieruhr"><div class="timer-copy"><span class="timer-icon" aria-hidden="true">⏱</span><div><strong id="timer-mode">${state.timer.mode}</strong><div class="small muted" id="timer-status">Bereit</div></div></div><div class="timer-digits" id="timer-digits">${clock(remaining())}</div><div class="timer-actions"><button class="light" id="timer-toggle">Start</button><button class="ghost" id="timer-reset">Zurücksetzen</button><button class="gold" id="timer-break">Pause starten</button></div></section><div class="schedule-overview"><div class="rounds no-print">${state.schedule.map((x,i)=>`<button data-round="${i}" class="${i===state.currentRound?'active':''}" aria-pressed="${i===state.currentRound}" aria-label="Zu Runde ${x.round}">${x.round}</button>`).join('')}</div><div class="schedule-facts"><span>${state.schedule.length} Runden</span><span>${s.games} Begegnungen</span><span>${state.minutes} + ${state.breakMinutes} Min.</span></div></div><div class="schedule-list">${state.schedule.map((r,i)=>renderRound(r,i)).join('')}</div><div class="footer-note"><span>${state.minutes} Minuten Spielzeit · ${state.breakMinutes} Minuten Pause zwischen den Runden</span><span>Partner und Gegner wechseln möglichst oft.</span></div>`}
function renderRound(r,index){return `<section class="round-block ${index===state.currentRound?'current':''}" id="round-${r.round}" data-round-section="${index}"><div class="round-heading"><div class="round-title"><span class="round-number">${r.round}</span><div><h3>Runde ${r.round}</h3><div class="small muted">${r.matches.length} ${r.matches.length===1?'Feld':'Felder'} belegt</div></div></div><div class="round-meta"><span>${state.minutes} Min. Spielzeit</span>${index<state.schedule.length-1?`<span>danach ${state.breakMinutes} Min. Pause</span>`:''}</div></div><div class="matches">${r.matches.map(renderMatch).join('')}</div>${r.byes.length?`<div class="bye-panel"><h3>Pause in dieser Runde</h3><div class="bye-list">${r.byes.map(id=>`<span class="bye" style="--player-color:${playerColor(id)}"><span class="player-dot" aria-hidden="true"></span>${esc(displayName(id))} · ${groupName(id[0])}</span>`).join('')}</div></div>`:''}</section>`}
function renderMatch(m){const result=state.results[m.id],t1=m.teams[0],t2=m.teams[1];return `<article class="match ${result?'saved':''}" data-match="${m.id}"><div class="match-top"><span class="court">FELD ${m.court}</span><span class="pill">${result?'Ergebnis gespeichert':'Doppel'}</span></div><div class="team-vs">${renderTeam(t1)}<span class="vs">VS</span>${renderTeam(t2)}</div><div class="small muted" style="margin-top:10px;text-align:center">Abgeschlossene Spiele bei Zeitende</div><div class="score"><input data-score="${m.id}" data-side="0" type="number" min="0" max="99" step="1" inputmode="numeric" aria-label="Abgeschlossene Spiele Team 1" value="${result?.[0]??''}" placeholder="–"><span>:</span><input data-score="${m.id}" data-side="1" type="number" min="0" max="99" step="1" inputmode="numeric" aria-label="Abgeschlossene Spiele Team 2" value="${result?.[1]??''}" placeholder="–"></div><button class="save-result ${result?'ghost':'primary'}" data-save="${m.id}" data-mode="${result?'edit':'save'}">${result?'✓ Ergebnis ändern':'Ergebnis speichern'}</button></article>`}
function renderTeam(ids){return `<div class="team">${ids.map(id=>`<div style="margin-bottom:10px;--player-color:${playerColor(id)}"><div class="player-label"><span class="player-dot" aria-hidden="true"></span><span class="player-name">${esc(displayName(id))}</span></div><div class="level">${groupName(id[0])}</div></div>`).join('')}</div>`}
function enterResultEdit(card){card.classList.remove('saved');const b=card.querySelector('[data-save]');b.dataset.mode='save';b.textContent='Ergebnis speichern';b.classList.remove('ghost');b.classList.add('primary');const pill=card.querySelector('.match-top .pill');if(pill)pill.textContent='Änderung offen'}
function bindSchedule(){$$('[data-round]').forEach(b=>b.onclick=()=>{const next=Number(b.dataset.round);if(next!==state.currentRound){if(state.timer.end&&!confirm('Der laufende Timer wird angehalten und für die neue Runde zurückgesetzt. Fortfahren?'))return;state.currentRound=next;state.timer={remaining:state.minutes*60,end:null,mode:'Spielzeit'};releaseWake();persist();updateTimer()}$$('[data-round]').forEach(x=>{const active=x===b;x.classList.toggle('active',active);x.setAttribute('aria-pressed',active)});$$('[data-round-section]').forEach(x=>x.classList.toggle('current',Number(x.dataset.roundSection)===state.currentRound));$(`#round-${state.currentRound+1}`)?.scrollIntoView({behavior:'smooth',block:'start'})});$$('[data-score]').forEach(input=>input.oninput=()=>{const card=input.closest('.match');if(card.querySelector('[data-save]').dataset.mode==='edit')enterResultEdit(card)});$$('[data-save]').forEach(b=>b.onclick=()=>{const card=b.closest('.match');if(b.dataset.mode==='edit'){enterResultEdit(card);card.querySelector('input')?.focus();return}const matchId=b.dataset.save,inputs=[...card.querySelectorAll(`[data-score="${matchId}"]`)],values=inputs.map(i=>i.value);if(values.some(v=>v==='')){toast('Bitte die abgeschlossenen Spiele beider Teams eintragen.');return}const nums=values.map(Number);if(nums.some(n=>!Number.isInteger(n)||n<0||n>99)){toast('Erlaubt sind ganze Spielstände von 0 bis 99.');return}state.results[matchId]=nums;persist();render();requestAnimationFrame(()=>$(`[data-match="${matchId}"]`)?.scrollIntoView({block:'center'}));toast('Ergebnis gespeichert. Die Einzelwertung ist aktuell.')});$('#timer-toggle').onclick=toggleTimer;$('#timer-reset').onclick=()=>{if(state.timer.end&&!confirm('Den laufenden Timer wirklich zurücksetzen?'))return;resetTimer(state.timer.mode)};$('#timer-break').onclick=()=>{if(!state.breakMinutes){toast('Die Pausenzeit ist auf 0 Minuten eingestellt.');return}if(state.timer.end&&!confirm('Die laufende Spielzeit beenden und die Pause starten?'))return;state.timer={remaining:state.breakMinutes*60,end:Date.now()+state.breakMinutes*60000,mode:'Pause'};persist();requestWake();updateTimer()};updateTimer()}
function standings(){const rows=state.players.map(p=>({id:p.id,name:displayName(p.id),level:p.level,played:0,wins:0,draws:0,points:0,for:0,against:0,diff:0})),map=Object.fromEntries(rows.map(r=>[r.id,r]));for(const round of state.schedule)for(const m of round.matches){const score=state.results[m.id];if(!score)continue;for(let side=0;side<2;side++)for(const id of m.teams[side]){const r=map[id];r.played++;r.for+=score[side];r.against+=score[1-side];if(score[0]===score[1]){r.draws++;r.points++}else if(score[side]>score[1-side]){r.wins++;r.points+=2}}}for(const r of rows)r.diff=r.for-r.against;rows.sort((a,b)=>b.points-a.points||b.diff-a.diff||b.for-a.for||a.name.localeCompare(b.name,'de'));rows.forEach(r=>{r.rank=r.played?1+rows.filter(o=>o.played&&(o.points>r.points||(o.points===r.points&&o.diff>r.diff)||(o.points===r.points&&o.diff===r.diff&&o.for>r.for))).length:null});return rows}
function renderStandings(){if(!state.schedule.length)return empty('Noch keine Tabelle','Die Einzelwertung erscheint, sobald ein Spielplan erstellt wurde.','Spielplan erstellen','setup');const rows=standings();return `<div class="intro"><div><div class="eyebrow">Persönliche Wertung</div><h2>Schleiferl-Tabelle</h2></div><button class="ghost no-print" onclick="window.print()">Tabelle drucken</button></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>Platz</th><th>Spieler</th><th>Gruppe</th><th>Runden</th><th>Siege</th><th>Unentschieden</th><th>Schleiferlpunkte</th><th>Spieldifferenz</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="rank">${r.rank||'–'}</td><td><div class="standings-player" style="--player-color:${playerColor(r.id)}"><span class="player-dot" aria-hidden="true"></span><div><strong>${esc(r.name)}</strong><div class="small muted">${r.id}</div></div></div></td><td><span class="pill ${r.level==='A'?'beginner':'advanced'}">${groupName(r.level)}</span></td><td>${r.played}</td><td>${r.wins}</td><td>${r.draws}</td><td class="points">${r.points}</td><td>${r.diff>0?'+':''}${r.diff}</td></tr>`).join('')}</tbody></table></div></section><p class="small muted" style="margin-top:14px">Wertung: Sieg 2 Punkte, Unentschieden 1 Punkt. Danach zählen die Differenz und die Anzahl der gewonnenen Tennis-Spiele.</p>`}
function renderRules(){const s=scheduleStats();return `<div class="intro"><div><div class="eyebrow">Klarer Ablauf</div><h2>Spielmodus & Regeln</h2></div><button class="ghost no-print" id="print-fields">Feldschilder drucken</button></div><div class="rules-grid"><section class="panel"><h3>So funktioniert das Schleiferlturnier</h3><ol><li>Alle Teilnehmer spielen als Einzelpersonen in wechselnden Doppeln.</li><li>Jedes Team besteht immer aus genau einer Person aus Gruppe A und einer Person aus Gruppe B.</li><li>Partner, Gegner und Pausen werden möglichst gleichmäßig verteilt.</li><li>Nach jeder Runde werden die Doppel neu zusammengestellt.</li><li>Ergebnisse zählen für beide Mitglieder eines Doppels gleichermaßen.</li></ol></section><section class="panel"><h3>Tenniszählweise & Zeitende</h3><p>Innerhalb jedes Spiels wird regulär mit 0, 15, 30 und 40 gezählt. Bei 40:40 folgen Einstand und Vorteil; zum Spielgewinn sind anschließend zwei Punkte Vorsprung nötig.</p><p>Bis zum Ablauf der Rundenzeit werden die gewonnenen Spiele fortlaufend gezählt. Beim Zeitsignal gilt der Stand der vollständig beendeten Spiele. Ein noch laufendes Spiel wird nicht gewertet; vollständig ausgespielte Breaks zählen wie jedes andere Spiel.</p></section><section class="panel"><h3>Digital oder manuell auslosen</h3><p><strong>Digital:</strong> Unter „Planung“ alle Namen eintragen und „Digital auslosen“ wählen. Die Namen werden innerhalb von Gruppe A und Gruppe B gemischt und erhalten dadurch neue Kürzel und Farben.</p><p><strong>Manuell:</strong> „Loskarten drucken“ wählen, die Karten nach Gruppe trennen und mischen. Jede Person zieht in ihrer Gruppe ein Kürzel. Anschließend den Namen beim gezogenen Kürzel eintragen.</p></section><section class="panel"><h3>Aktueller Rahmen</h3><p><strong>${players().length} Personen</strong> · ${players('A').length} in Gruppe A · ${players('B').length} in Gruppe B</p><p><strong>${state.rounds} Runden</strong> · bis zu ${s.active} Felder gleichzeitig · ${state.minutes} Minuten je Runde · ${state.breakMinutes} Minuten Pause</p><p>Spielzeit: ${s.playDuration} Minuten · Pausenzeit: ${s.breakDuration} Minuten · Gesamtdauer: ungefähr ${s.duration} Minuten.</p></section><section class="panel"><h3>Turnierwertung</h3><p>Das Doppel mit mehr vollständig gewonnenen Spielen gewinnt die Runde. Ein Sieg bringt jedem Mitglied zwei Schleiferlpunkte, bei Unentschieden erhält jede Person einen Punkt. Bei Punktgleichheit in der Tabelle entscheidet zuerst die Spieldifferenz, danach die Zahl der gewonnenen Spiele.</p></section><section class="panel"><h3>Hinweis bei ungleichen Gruppen</h3><p>Die beiden Gruppen müssen nicht gleich groß sein. Pro Feld werden aber immer zwei Personen aus jeder Gruppe benötigt. Überzählige Spieler erhalten fair verteilte Pausen.</p></section></div>`}
function firstAssignment(id){for(const r of state.schedule)for(const m of r.matches)if(m.teams.flat().includes(id))return{round:r.round,court:m.court};return null}
function printExtras(kind){let html='';if(kind==='players'){for(const level of ['A','B'])html+=`<section class="print-sheet"><h1>${esc(state.title)} · Gruppe ${level}</h1><p>Spielerliste mit den dauerhaft zugeordneten Farben und Kürzeln.</p><table class="print-list"><thead><tr><th>Kürzel</th><th>Farbe</th><th>Name</th></tr></thead><tbody>${players(level).map(p=>`<tr><td><strong>${p.id}</strong></td><td><span class="lot-color" style="--player-color:${playerColor(p.id)}"></span></td><td>${esc(p.name||'________________________')}</td></tr>`).join('')}</tbody></table></section>`}else if(kind==='lots'){for(const level of ['A','B']){const list=players(level);for(let page=0;page<list.length;page+=6){const chunk=list.slice(page,page+6);html+=`<section class="print-sheet"><h1>Loskarten · Gruppe ${level}</h1><p>Bei 100 % drucken, ausschneiden und getrennt von der anderen Gruppe mischen. Nach dem Ziehen den Namen beim Kürzel in der Planung eintragen.</p><div class="los-grid">${chunk.map(p=>{const first=firstAssignment(p.id);return `<div class="los-card" style="--player-color:${playerColor(p.id)}"><span>GRUPPE ${level}</span><div class="lot-code"><span class="lot-color"></span>${p.id}</div>${first?`<p>Erster Einsatz: Runde ${first.round}, Feld ${first.court}</p>`:'<p>Der erste Einsatz steht nach Erstellung des Spielplans fest.</p>'}<p>Name: ________________________</p></div>`}).join('')}</div></section>`}}}else if(kind==='fields'){if(!state.schedule.length){toast('Bitte zuerst einen Spielplan erstellen.');return}const maxField=Math.max(...state.schedule.flatMap(r=>r.matches.map(m=>m.court)));for(let field=1;field<=maxField;field++){html+=`<section class="print-sheet print-field"><p>${esc(state.title)}</p><div class="field-number">FELD ${field}</div><p>${state.minutes} Minuten spielen · ${state.breakMinutes} Minuten Pause</p><table class="print-list"><thead><tr><th>Runde</th><th>Begegnung</th></tr></thead><tbody>${state.schedule.map(r=>{const m=r.matches.find(x=>x.court===field);return `<tr><td>${r.round}</td><td>${m?`${m.teams[0].map(displayName).map(esc).join(' + ')} gegen ${m.teams[1].map(displayName).map(esc).join(' + ')}`:'Feld frei'}</td></tr>`}).join('')}</tbody></table></section>`}}$('#print-extra').innerHTML=html;document.body.classList.add('printing-extra');window.print()}
function bindRules(){$('#print-fields').onclick=()=>printExtras('fields')}
function empty(title,text,label,target){return `<section class="panel empty"><h2>${title}</h2><p>${text}</p><button class="primary" data-go="${target}">${label}</button></section>`}
function render(){document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-current',b.dataset.view===view?'page':'false')});$('#main').innerHTML=({setup:renderSetup,schedule:renderSchedule,standings:renderStandings,rules:renderRules}[view])();({setup:bindSetup,schedule:bindSchedule,standings:()=>{},rules:bindRules}[view])();$$('[data-go]').forEach(b=>b.onclick=()=>{view=b.dataset.go;render()})}
function migrate(raw){if(!raw||typeof raw!=='object')return raw;if(!Number.isInteger(raw.breakMinutes))raw.breakMinutes=5;if(!raw.timer||typeof raw.timer!=='object')raw.timer={remaining:(Number.isInteger(raw.minutes)?raw.minutes:15)*60,end:null,mode:'Spielzeit'};if(!Array.isArray(raw.players)||!raw.players.some(p=>p?.level==='F'))return raw;const id=id=>typeof id==='string'&&id[0]==='F'?'B'+id.slice(1):id;raw.players=raw.players.map(p=>({...p,id:id(p.id),level:p.level==='F'?'B':p.level}));if(Array.isArray(raw.schedule))raw.schedule=raw.schedule.map(r=>({...r,byes:Array.isArray(r.byes)?r.byes.map(id):r.byes,matches:Array.isArray(r.matches)?r.matches.map(m=>({...m,teams:Array.isArray(m.teams)?m.teams.map(t=>Array.isArray(t)?t.map(id):t):m.teams})):r.matches}));return raw}
function validate(raw){if(!raw||raw.version!==1||!Array.isArray(raw.players)||!Array.isArray(raw.schedule)||!raw.results||Array.isArray(raw.results)||typeof raw.results!=='object')throw new Error('Das ist keine gültige Schleiferlturnier-Sicherung.');if(typeof raw.title!=='string'||raw.title.length>80||!raw.players.every(p=>p&&/^[AB][1-9]\d*$/.test(p.id)&&['A','B'].includes(p.level)&&p.id[0]===p.level&&typeof p.name==='string'&&p.name.length<=60))throw new Error('Ungültige Teilnehmerliste.');if(new Set(raw.players.map(p=>p.id)).size!==raw.players.length||['A','B'].some(l=>raw.players.filter(p=>p.level===l).length<2))throw new Error('Die Teilnehmerliste ist unvollständig.');if(!Number.isInteger(raw.rounds)||raw.rounds<1||raw.rounds>30||!Number.isInteger(raw.courts)||raw.courts<1||raw.courts>12||!Number.isInteger(raw.minutes)||raw.minutes<5||raw.minutes>60||!Number.isInteger(raw.breakMinutes)||raw.breakMinutes<0||raw.breakMinutes>60)throw new Error('Ungültige Turniereinstellungen.');const timer=raw.timer;if(!timer||!Number.isInteger(timer.remaining)||timer.remaining<0||timer.remaining>3600||!['Spielzeit','Pause'].includes(timer.mode)||(timer.end!==null&&(!Number.isFinite(timer.end)||timer.end<0||timer.end>Date.now()+7200000)))throw new Error('Ungültige Timerdaten.');const known=new Set(raw.players.map(p=>p.id)),matchIds=new Set();if(raw.schedule.length&&!raw.schedule.every((r,ri)=>r&&r.round===ri+1&&Array.isArray(r.matches)&&Array.isArray(r.byes)&&r.byes.every(id=>known.has(id))&&r.matches.every((m,mi)=>m&&m.id===`R${ri+1}F${mi+1}`&&m.court===mi+1&&Array.isArray(m.teams)&&m.teams.length===2&&m.teams.every(t=>Array.isArray(t)&&t.length===2&&t.every(id=>known.has(id))&&t.map(id=>id[0]).sort().join('')==='AB')&&!matchIds.has(m.id)&&(matchIds.add(m.id),true))))throw new Error('Ungültiger Spielplan in der Sicherung.');for(const [id,score] of Object.entries(raw.results)){if(!matchIds.has(id)||!Array.isArray(score)||score.length!==2||!score.every(n=>Number.isInteger(n)&&n>=0&&n<=99))throw new Error('Ungültiges Ergebnis in der Sicherung.')}if(!Number.isInteger(raw.currentRound)||raw.currentRound<0||raw.currentRound>Math.max(0,raw.schedule.length-1))raw.currentRound=0;return raw}
function openBackup(){const d=$('#dialog');d.innerHTML=`<h2>Turnierstand sichern</h2><p>Teilnehmer, Spielplan und Ergebnisse werden auf diesem Gerät gespeichert. Für einen Gerätewechsel kannst du eine Sicherung herunterladen.</p><div class="dialog-actions"><button class="ghost" id="export">Sicherung herunterladen</button><button class="ghost" id="import">Sicherung einlesen</button><button class="danger" id="reset">Neues Turnier</button><button class="primary" id="close">Schließen</button></div>`;d.showModal();$('#close').onclick=()=>d.close();$('#export').onclick=downloadBackup;$('#import').onclick=()=>{$('#import-file').click();d.close()};$('#reset').onclick=()=>{d.innerHTML=`<h2>Wirklich neu beginnen?</h2><p>Alle Teilnehmer, Paarungen und Ergebnisse werden gelöscht.</p><div class="dialog-actions"><button class="ghost" id="cancel-reset">Abbrechen</button><button class="danger" id="confirm-reset">Alles zurücksetzen</button></div>`;$('#cancel-reset').onclick=()=>d.close();$('#confirm-reset').onclick=()=>{state=fresh();view='setup';persist();render();d.close();toast('Neues Schleiferlturnier angelegt.')}}}
function downloadBackup(){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.href=url;a.download=`Schleiferlturnier-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}
$('#import-file').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>1000000)throw new Error('Die Sicherung ist zu groß.');const imported=validate(migrate(JSON.parse(await file.text())));if(!confirm('Der aktuelle Turnierstand wird vollständig ersetzt. Fortfahren?'))return;state=imported;state.currentRound=Math.min(state.currentRound||0,Math.max(0,state.schedule.length-1));persist();view='schedule';render();toast('Sicherung eingelesen.')}catch(err){toast(err instanceof SyntaxError?'Die Datei enthält keine gültigen Daten.':err.message)}};
$('#backup').onclick=openBackup;$$('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});
try{const saved=localStorage.getItem(KEY);if(saved)state=validate(migrate(JSON.parse(saved)))}catch{}
render();
window.addEventListener('afterprint',()=>{document.body.classList.remove('printing-extra');$('#print-extra').innerHTML=''});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){updateTimer();if(state.timer.end)requestWake()}});
setInterval(updateTimer,250);
</script>
