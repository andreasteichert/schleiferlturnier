function renderSchedule(){if(!state.schedule.length)return empty('Noch kein Spielplan','Trage unter „Planung“ die Teilnehmer ein und erstelle anschließend den Spielplan.','Zur Planung','setup');const s=scheduleStats();return `<div class="intro"><div><div class="eyebrow">${esc(state.title)}</div><h2>Alle Runden im Überblick</h2></div><button class="ghost no-print" id="print-schedule">Gesamten Spielplan drucken</button></div><section class="timer-panel no-print" aria-label="Turnieruhr"><div class="timer-copy"><span class="timer-icon" aria-hidden="true">⏱</span><div><strong id="timer-mode">${state.timer.mode}</strong><div class="small muted" id="timer-status">Bereit</div></div></div><div class="timer-digits" id="timer-digits">${clock(remaining())}</div><div class="timer-actions"><button class="light" id="timer-toggle">Start</button><button class="ghost" id="timer-reset">Zurücksetzen</button><button class="gold" id="timer-break">Pause starten</button></div></section><div class="schedule-overview"><div class="rounds no-print">${state.schedule.map((x,i)=>{const unlocked=roundUnlocked(i),complete=roundComplete(i);return `<button data-round="${i}" class="${i===state.currentRound?'active ':''}${complete?'completed ':''}${!unlocked?'locked':''}" aria-pressed="${i===state.currentRound}" aria-label="Zu Runde ${x.round}${!unlocked?', gesperrt':''}" ${!unlocked?'disabled':''}>${x.round}</button>`}).join('')}</div><div class="schedule-facts"><span>${state.schedule.length} Runden</span><span>${s.games} Begegnungen</span><span>${state.minutes} + ${state.breakMinutes} Min.</span></div></div><div class="schedule-list">${state.schedule.map((r,i)=>renderRound(r,i)).join('')}</div><div class="footer-note"><span>${state.minutes} Minuten Spielzeit · ${state.breakMinutes} Minuten Pause zwischen den Runden</span><span>Partner und Gegner wechseln möglichst oft.</span></div>`}
function renderRound(r,index){const entered=roundResultCount(index),total=r.matches.length,locked=!roundUnlocked(index),percent=total?entered/total*100:100;return `<section class="round-block ${index===state.currentRound?'current ':''}${locked?'locked':''}" id="round-${r.round}" data-round-section="${index}"><div class="round-heading"><div class="round-title"><span class="round-number">${r.round}</span><div><h3>Runde ${r.round}</h3><div class="small muted">${r.matches.length} ${r.matches.length===1?'Platz':'Plätze'} belegt</div></div></div><div class="round-meta"><span>${state.minutes} Min. Spielzeit</span>${index<state.schedule.length-1?`<span>danach ${state.breakMinutes} Min. Pause</span>`:''}</div></div><div class="round-progress" role="progressbar" aria-label="Ergebnisse in Runde ${r.round}" aria-valuenow="${entered}" aria-valuemin="0" aria-valuemax="${total}"><div class="round-progress-copy"><span class="small muted">${entered} von ${total} Ergebnissen in dieser Runde eingetragen.</span><strong>${entered===total?'Runde vollständig':locked?'Noch gesperrt':'Eingabe möglich'}</strong></div><div class="round-progress-track"><div class="round-progress-fill" style="width:${percent}%"></div></div></div>${locked?`<div class="round-lock" role="status">Ergebniseingabe gesperrt. Bitte zuerst Runde ${r.round-1} vollständig abschließen.</div>`:''}<div class="matches">${r.matches.map(m=>renderMatch(m,locked)).join('')}</div><div class="bye-panel"><h3>Pause in dieser Runde</h3><div class="bye-list">${r.byes.length?r.byes.map(id=>`<span class="bye" style="--player-color:${playerColor(id)}"><span class="player-dot" aria-hidden="true"></span>${esc(displayName(id))} · ${groupName(id[0])}</span>`).join(''):'<span class="bye">Niemand – alle spielen</span>'}</div></div></section>`}
function renderMatch(m,locked=false){const result=state.results[m.id],t1=m.teams[0],t2=m.teams[1],disabled=locked?' disabled':'';return `<article class="match ${result?'saved':''}" data-match="${m.id}"><div class="match-top"><span class="court">PLATZ ${m.court}</span><span class="pill">${result?'Ergebnis gespeichert':locked?'Runde gesperrt':'Doppel'}</span></div><div class="team-vs">${renderTeam(t1)}<span class="vs">VS</span>${renderTeam(t2)}</div><div class="small muted" style="margin-top:10px;text-align:center">Abgeschlossene Spiele bei Zeitende</div><div class="score"><input data-score="${m.id}" data-side="0" type="number" min="0" max="99" step="1" inputmode="numeric" aria-label="Abgeschlossene Spiele Team 1" value="${result?.[0]??''}" placeholder="–"${disabled}><span>:</span><input data-score="${m.id}" data-side="1" type="number" min="0" max="99" step="1" inputmode="numeric" aria-label="Abgeschlossene Spiele Team 2" value="${result?.[1]??''}" placeholder="–"${disabled}></div><button class="save-result ${result?'ghost':'primary'}" data-save="${m.id}" data-mode="${result?'edit':'save'}"${disabled}>${result?'✓ Ergebnis ändern':locked?'Runde gesperrt':'Ergebnis speichern'}</button></article>`}
function renderTeam(ids){return `<div class="team">${ids.map(id=>`<div style="margin-bottom:10px;--player-color:${playerColor(id)}"><div class="player-label"><span class="player-dot" aria-hidden="true"></span><span class="player-name">${esc(displayName(id))}</span></div><div class="level">${groupName(id[0])}</div></div>`).join('')}</div>`}
function enterResultEdit(card){card.classList.remove('saved');const b=card.querySelector('[data-save]');b.dataset.mode='save';b.textContent='Ergebnis speichern';b.classList.remove('ghost');b.classList.add('primary');const pill=card.querySelector('.match-top .pill');if(pill)pill.textContent='Änderung offen'}
function bindSchedule(){$$('[data-round]').forEach(b=>b.onclick=()=>{const next=Number(b.dataset.round);if(!roundUnlocked(next)){toast(`Bitte zuerst Runde ${next} vollständig abschließen.`);return}if(next!==state.currentRound){if(state.timer.end&&!confirm('Der laufende Timer wird angehalten und für die neue Runde zurückgesetzt. Fortfahren?'))return;state.currentRound=next;state.timer={remaining:state.minutes*60,end:null,mode:'Spielzeit'};releaseWake();persist();updateTimer()}$$('[data-round]').forEach(x=>{const active=x===b;x.classList.toggle('active',active);x.setAttribute('aria-pressed',active)});$$('[data-round-section]').forEach(x=>x.classList.toggle('current',Number(x.dataset.roundSection)===state.currentRound));$(`#round-${state.currentRound+1}`)?.scrollIntoView({behavior:'smooth',block:'start'})});$$('[data-score]').forEach(input=>input.oninput=()=>{const card=input.closest('.match');if(card.querySelector('[data-save]').dataset.mode==='edit')enterResultEdit(card)});$$('[data-save]').forEach(b=>b.onclick=()=>{const card=b.closest('.match'),matchId=b.dataset.save,roundIndex=state.schedule.findIndex(r=>r.matches.some(m=>m.id===matchId));if(!roundUnlocked(roundIndex)){toast(`Bitte zuerst Runde ${roundIndex} vollständig abschließen.`);return}if(b.dataset.mode==='edit'){enterResultEdit(card);card.querySelector('input')?.focus();return}const inputs=[...card.querySelectorAll(`[data-score="${matchId}"]`)],values=inputs.map(i=>i.value);if(values.some(v=>v==='')){toast('Bitte die abgeschlossenen Spiele beider Teams eintragen.');return}const nums=values.map(Number);if(nums.some(n=>!Number.isInteger(n)||n<0||n>99)){toast('Erlaubt sind ganze Spielstände von 0 bis 99.');return}state.results[matchId]=nums;persist();render();requestAnimationFrame(()=>$(`[data-match="${matchId}"]`)?.scrollIntoView({block:'center'}));const complete=roundComplete(roundIndex);toast(complete?(roundIndex<state.schedule.length-1?`Runde ${roundIndex+1} ist vollständig. Die nächste Runde ist freigeschaltet.`:'Die letzte Runde ist vollständig. Das Turnier ist abgeschlossen.'):'Ergebnis gespeichert. Die Einzelwertung ist aktuell.')});$('#timer-toggle').onclick=toggleTimer;$('#timer-reset').onclick=()=>{if(state.timer.end&&!confirm('Den laufenden Timer wirklich zurücksetzen?'))return;resetTimer(state.timer.mode)};$('#timer-break').onclick=()=>{if(!state.breakMinutes){toast('Die Pausenzeit ist auf 0 Minuten eingestellt.');return}if(state.timer.end&&!confirm('Die laufende Spielzeit beenden und die Pause starten?'))return;state.timer={remaining:state.breakMinutes*60,end:Date.now()+state.breakMinutes*60000,mode:'Pause'};persist();requestWake();updateTimer()};$('#print-schedule').onclick=()=>printExtras('schedule');updateTimer()}
function standings(){const rows=state.players.map(p=>({id:p.id,name:displayName(p.id),level:p.level,played:0,wins:0,draws:0,points:0,for:0,against:0,diff:0})),map=Object.fromEntries(rows.map(r=>[r.id,r]));for(const round of state.schedule)for(const m of round.matches){const score=state.results[m.id];if(!score)continue;for(let side=0;side<2;side++)for(const id of m.teams[side]){const r=map[id];r.played++;r.for+=score[side];r.against+=score[1-side];if(score[0]===score[1]){r.draws++;r.points++}else if(score[side]>score[1-side]){r.wins++;r.points+=2}}}for(const r of rows)r.diff=r.for-r.against;rows.sort((a,b)=>b.points-a.points||b.diff-a.diff||b.for-a.for||a.name.localeCompare(b.name,'de'));rows.forEach(r=>{r.rank=r.played?1+rows.filter(o=>o.played&&(o.points>r.points||(o.points===r.points&&o.diff>r.diff)||(o.points===r.points&&o.diff===r.diff&&o.for>r.for))).length:null});return rows}
function renderStandings(){if(!state.schedule.length)return empty('Noch keine Tabelle','Die Einzelwertung erscheint, sobald ein Spielplan erstellt wurde.','Spielplan erstellen','setup');const rows=standings();return `<div class="intro"><div><div class="eyebrow">Persönliche Wertung</div><h2>Schleiferl-Tabelle</h2></div><button class="ghost no-print" onclick="window.print()">Tabelle drucken</button></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>Platz</th><th>Spieler</th><th>Gruppe</th><th>Runden</th><th>Siege</th><th>Unentschieden</th><th>Schleiferlpunkte</th><th>Spieldifferenz</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="rank">${r.rank||'–'}</td><td><div class="standings-player" style="--player-color:${playerColor(r.id)}"><span class="player-dot" aria-hidden="true"></span><div><strong>${esc(r.name)}</strong><div class="small muted">${r.id}</div></div></div></td><td><span class="pill ${r.level==='A'?'beginner':'advanced'}">${groupName(r.level)}</span></td><td>${r.played}</td><td>${r.wins}</td><td>${r.draws}</td><td class="points">${r.points}</td><td>${r.diff>0?'+':''}${r.diff}</td></tr>`).join('')}</tbody></table></div></section><p class="small muted" style="margin-top:14px">Wertung: Sieg 2 Punkte, Unentschieden 1 Punkt. Danach zählen die Differenz und die Anzahl der gewonnenen Tennis-Spiele.</p>`}
function renderRules(){const s=scheduleStats();return `<div class="intro"><div><div class="eyebrow">Klarer Ablauf</div><h2>Spielmodus & Regeln</h2></div><button class="ghost no-print" id="print-places">Platzkarten erstellen</button></div><div class="rules-grid"><section class="panel"><h3>So funktioniert das Schleiferlturnier</h3><ol><li>Alle Teilnehmer spielen als Einzelpersonen in wechselnden Doppeln.</li><li>Jedes Team besteht immer aus genau einer Person aus Gruppe A und einer Person aus Gruppe B.</li><li>Partner, Gegner und Pausen werden möglichst gleichmäßig verteilt.</li><li>Nach jeder Runde werden die Doppel neu zusammengestellt.</li><li>Ergebnisse zählen für beide Mitglieder eines Doppels gleichermaßen.</li></ol></section><section class="panel"><h3>Tenniszählweise & Zeitende</h3><p>Innerhalb jedes Spiels wird regulär mit 0, 15, 30 und 40 gezählt. Bei 40:40 folgen Einstand und Vorteil; zum Spielgewinn sind anschließend zwei Punkte Vorsprung nötig.</p><p>Bis zum Ablauf der Rundenzeit werden die gewonnenen Spiele fortlaufend gezählt. Beim Zeitsignal gilt der Stand der vollständig beendeten Spiele. Ein noch laufendes Spiel wird nicht gewertet; vollständig ausgespielte Breaks zählen wie jedes andere Spiel.</p></section><section class="panel"><h3>Digital oder manuell auslosen</h3><p><strong>Digital:</strong> Unter „Planung“ alle Namen eintragen und „Digital auslosen“ wählen. Die Namen werden innerhalb von Gruppe A und Gruppe B gemischt und erhalten dadurch neue Kürzel und Farben.</p><p><strong>Manuell:</strong> „Loskarten drucken“ wählen, die Karten nach Gruppe trennen und mischen. Jede Person zieht in ihrer Gruppe ein Kürzel. Anschließend den Namen beim gezogenen Kürzel eintragen.</p></section><section class="panel"><h3>Aktueller Rahmen</h3><p><strong>${players().length} Personen</strong> · ${players('A').length} in Gruppe A · ${players('B').length} in Gruppe B</p><p><strong>${state.rounds} Runden</strong> · bis zu ${s.active} Plätze gleichzeitig · ${state.minutes} Minuten je Runde · ${state.breakMinutes} Minuten Pause</p><p>Spielzeit: ${s.playDuration} Minuten · Pausenzeit: ${s.breakDuration} Minuten · Gesamtdauer: ungefähr ${s.duration} Minuten.</p></section><section class="panel"><h3>Turnierwertung</h3><p>Das Doppel mit mehr vollständig gewonnenen Spielen gewinnt die Runde. Ein Sieg bringt jedem Mitglied zwei Schleiferlpunkte, bei Unentschieden erhält jede Person einen Punkt. Bei Punktgleichheit in der Tabelle entscheidet zuerst die Spieldifferenz, danach die Zahl der gewonnenen Spiele.</p></section><section class="panel"><h3>Hinweis bei ungleichen Gruppen</h3><p>Die beiden Gruppen müssen nicht gleich groß sein. Pro Platz werden aber immer zwei Personen aus jeder Gruppe benötigt. Überzählige Spieler erhalten fair verteilte Pausen.</p></section></div>`}
function firstAssignment(id){for(const r of state.schedule)for(const m of r.matches)if(m.teams.flat().includes(id))return{round:r.round,court:m.court};return null}
function printTeam(ids){return ids.map(id=>`<div class="print-player-line"><strong>${esc(displayName(id))}</strong><span> · ${groupName(id[0])}</span></div>`).join('')}
function printExtras(kind){let html='';if(kind==='players'){for(const level of ['A','B'])html+=`<section class="print-sheet"><h1>${esc(state.title)} · Gruppe ${level}</h1><p>Spielerliste mit den dauerhaft zugeordneten Kürzeln.</p><table class="print-list"><thead><tr><th>Kürzel</th><th>Name</th></tr></thead><tbody>${players(level).map(p=>`<tr><td><strong>${p.id}</strong></td><td>${esc(p.name||'________________________')}</td></tr>`).join('')}</tbody></table></section>`}else if(kind==='lots'){for(const level of ['A','B']){const list=players(level);for(let page=0;page<list.length;page+=6){const chunk=list.slice(page,page+6);html+=`<section class="print-sheet"><h1>Loskarten · Gruppe ${level}</h1><p>Bei 100 % drucken, ausschneiden und getrennt von der anderen Gruppe mischen. Nach dem Ziehen den Namen beim Kürzel in der Planung eintragen.</p><div class="los-grid">${chunk.map(p=>{const first=firstAssignment(p.id);return `<div class="los-card" style="--player-color:${playerColor(p.id)}"><span>GRUPPE ${level}</span><div class="lot-code"><span class="lot-color"></span>${p.id}</div>${first?`<p>Erster Einsatz: Runde ${first.round}, Platz ${first.court}</p>`:'<p>Der erste Einsatz steht nach Erstellung des Spielplans fest.</p>'}<p>Name: ________________________</p></div>`}).join('')}</div></section>`}}}else if(kind==='schedule'){if(!state.schedule.length){toast('Bitte zuerst einen Spielplan erstellen.');return}const s=scheduleStats();html=`<section class="print-sheet print-schedule-sheet"><div class="print-kicker">Schleiferlturnier · Gesamtübersicht</div><h1 class="print-title">${esc(state.title)}</h1><p class="print-quote">Neue Runde - Neuer Partner! Viel Spaß &amp; ein verletzungsfreies Spiel.</p><div class="print-summary"><span>${state.schedule.length} Runden</span><span>${s.active} Plätze</span><span>${state.minutes} Min. Spiel · ${state.breakMinutes} Min. Pause</span></div>${state.schedule.map(r=>`<section class="print-round"><h2>Runde ${r.round}</h2><table><thead><tr><th>Platz</th><th>Doppel 1</th><th>Doppel 2</th><th>Ergebnis</th></tr></thead><tbody>${r.matches.map(m=>{const result=state.results[m.id];return `<tr><td><strong>${m.court}</strong></td><td>${printTeam(m.teams[0])}</td><td>${printTeam(m.teams[1])}</td><td>${result?`${result[0]} : ${result[1]}`:'–'}</td></tr>`}).join('')}</tbody></table>${r.byes.length?`<p class="print-byes"><strong>Pause:</strong> ${r.byes.map(displayName).map(esc).join(', ')}</p>`:''}</section>`).join('')}<div class="place-card-footer"><span>Viel Freude bei fairen Spielen!</span><span>Erstellt von Andreas Teichert</span></div></section>`}else if(kind==='places'){if(!state.schedule.length){toast('Bitte zuerst einen Spielplan erstellen.');return}const maxPlace=Math.max(...state.schedule.flatMap(r=>r.matches.map(m=>m.court)));for(let place=1;place<=maxPlace;place++){html+=`<section class="print-sheet"><div class="place-card"><div class="place-card-head"><div><div class="print-kicker">${esc(state.title)} · Platzkarte</div><h1 class="print-title">Willkommen auf dem Platz</h1></div><span class="place-badge">Schleiferlturnier</span></div><p class="print-quote">„Dieser Platz gehört heute Teamgeist, fairen Ballwechseln und jeder Menge Spielfreude.“</p><div class="place-number">PLATZ ${place}</div><p>${state.minutes} Minuten Spielzeit · ${state.breakMinutes} Minuten Pause zwischen den Runden</p><table><thead><tr><th>Runde</th><th>Begegnung</th></tr></thead><tbody>${state.schedule.map(r=>{const m=r.matches.find(x=>x.court===place);return `<tr><td><strong>${r.round}</strong></td><td>${m?`<div class="print-encounter"><div>${printTeam(m.teams[0])}</div><span class="print-vs">gegen</span><div>${printTeam(m.teams[1])}</div></div>`:'Platz frei'}</td></tr>`}).join('')}</tbody></table><div class="place-card-footer"><span>Viel Spaß und faire Spiele!</span><span>Erstellt von Andreas Teichert</span></div></div></section>`}}$('#print-extra').innerHTML=html;document.body.classList.add('printing-extra');window.print()}
const printExtrasWithoutEmptyPause=printExtras;
printExtras=function(kind){if(kind!=='schedule')return printExtrasWithoutEmptyPause(kind);const printNow=window.print;window.print=()=>{};try{printExtrasWithoutEmptyPause(kind)}finally{window.print=printNow}$$('#print-extra .print-round').forEach((section,index)=>{section.querySelector('.print-byes')?.remove();const r=state.schedule[index],pause=r.byes.length?r.byes.map(id=>`${esc(displayName(id))} · ${groupName(id[0])}`).join(', '):'Niemand – alle spielen';section.insertAdjacentHTML('beforeend',`<p class="print-byes"><strong>Pause:</strong> ${pause}</p>`)});printNow.call(window)};

function empty(title,text,label,target){return `<section class="panel empty"><h2>${title}</h2><p>${text}</p><button class="primary" data-go="${target}">${label}</button></section>`}
function render(){document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-current',b.dataset.view===view?'page':'false')});$('#main').innerHTML=({setup:renderSetup,schedule:renderSchedule,standings:renderStandings,rules:renderRules}[view])();({setup:bindSetup,schedule:bindSchedule,standings:()=>{},rules:bindRules}[view])();$$('[data-go]').forEach(b=>b.onclick=()=>{view=b.dataset.go;render()})}
function migrate(raw){if(!raw||typeof raw!=='object')return raw;if(!Number.isInteger(raw.breakMinutes))raw.breakMinutes=5;if(!raw.timer||typeof raw.timer!=='object')raw.timer={remaining:(Number.isInteger(raw.minutes)?raw.minutes:15)*60,end:null,mode:'Spielzeit'};if(!Array.isArray(raw.players)||!raw.players.some(p=>p?.level==='F'))return raw;const id=id=>typeof id==='string'&&id[0]==='F'?'B'+id.slice(1):id;raw.players=raw.players.map(p=>({...p,id:id(p.id),level:p.level==='F'?'B':p.level}));if(Array.isArray(raw.schedule))raw.schedule=raw.schedule.map(r=>({...r,byes:Array.isArray(r.byes)?r.byes.map(id):r.byes,matches:Array.isArray(r.matches)?r.matches.map(m=>({...m,teams:Array.isArray(m.teams)?m.teams.map(t=>Array.isArray(t)?t.map(id):t):m.teams})):r.matches}));return raw}
function validate(raw){if(!raw||raw.version!==1||!Array.isArray(raw.players)||!Array.isArray(raw.schedule)||!raw.results||Array.isArray(raw.results)||typeof raw.results!=='object')throw new Error('Das ist keine gültige Schleiferlturnier-Sicherung.');if(typeof raw.title!=='string'||raw.title.length>80||!raw.players.every(p=>p&&/^[AB][1-9]\d*$/.test(p.id)&&['A','B'].includes(p.level)&&p.id[0]===p.level&&typeof p.name==='string'&&p.name.length<=60))throw new Error('Ungültige Teilnehmerliste.');if(new Set(raw.players.map(p=>p.id)).size!==raw.players.length||['A','B'].some(l=>raw.players.filter(p=>p.level===l).length<2))throw new Error('Die Teilnehmerliste ist unvollständig.');if(!Number.isInteger(raw.rounds)||raw.rounds<1||raw.rounds>30||!Number.isInteger(raw.courts)||raw.courts<1||raw.courts>12||!Number.isInteger(raw.minutes)||raw.minutes<5||raw.minutes>60||!Number.isInteger(raw.breakMinutes)||raw.breakMinutes<0||raw.breakMinutes>60)throw new Error('Ungültige Turniereinstellungen.');const timer=raw.timer;if(!timer||!Number.isInteger(timer.remaining)||timer.remaining<0||timer.remaining>3600||!['Spielzeit','Pause'].includes(timer.mode)||(timer.end!==null&&(!Number.isFinite(timer.end)||timer.end<0||timer.end>Date.now()+7200000)))throw new Error('Ungültige Timerdaten.');const known=new Set(raw.players.map(p=>p.id)),matchIds=new Set();if(raw.schedule.length&&!raw.schedule.every((r,ri)=>r&&r.round===ri+1&&Array.isArray(r.matches)&&Array.isArray(r.byes)&&r.byes.every(id=>known.has(id))&&r.matches.every((m,mi)=>m&&m.id===`R${ri+1}F${mi+1}`&&m.court===mi+1&&Array.isArray(m.teams)&&m.teams.length===2&&m.teams.every(t=>Array.isArray(t)&&t.length===2&&t.every(id=>known.has(id))&&t.map(id=>id[0]).sort().join('')==='AB')&&!matchIds.has(m.id)&&(matchIds.add(m.id),true))))throw new Error('Ungültiger Spielplan in der Sicherung.');for(const [id,score] of Object.entries(raw.results)){if(!matchIds.has(id)||!Array.isArray(score)||score.length!==2||!score.every(n=>Number.isInteger(n)&&n>=0&&n<=99))throw new Error('Ungültiges Ergebnis in der Sicherung.')}if(!Number.isInteger(raw.currentRound)||raw.currentRound<0||raw.currentRound>Math.max(0,raw.schedule.length-1))raw.currentRound=0;return raw}
const validateBeforeRoundIntegrity=validate;
validate=function(raw){const checked=validateBeforeRoundIntegrity(raw),known=new Set(checked.players.map(p=>p.id));for(const round of checked.schedule){const played=round.matches.flatMap(match=>match.teams.flat()),all=[...played,...round.byes];if(new Set(played).size!==played.length||new Set(round.byes).size!==round.byes.length||all.length!==known.size||new Set(all).size!==known.size||all.some(id=>!known.has(id)))throw new Error('Ungültiger Spielplan in der Sicherung.')}return checked};
function openBackup(){const d=$('#dialog');d.innerHTML=`<h2>Turnierstand sichern</h2><p>Teilnehmer, Spielplan und Ergebnisse werden auf diesem Gerät gespeichert. Für einen Gerätewechsel kannst du eine Sicherung herunterladen.</p><div class="dialog-actions"><button class="ghost" id="export">Sicherung herunterladen</button><button class="ghost" id="export-public">Online-Stand exportieren</button><button class="ghost" id="import">Sicherung einlesen</button><button class="danger" id="reset">Neues Turnier</button><button class="primary" id="close">Schließen</button></div><p style="margin-top:18px">Für die öffentliche Nur-Lese-Seite die erzeugte Datei <strong>schleiferlturnierstand.json</strong> im Repository ersetzen. Veröffentlicht werden nur Spielplan, Pausen und bestätigte Ergebnisse.</p>`;d.showModal();$('#close').onclick=()=>d.close();$('#export').onclick=downloadBackup;$('#export-public').onclick=downloadPublicStand;$('#import').onclick=()=>{$('#import-file').click();d.close()};$('#reset').onclick=()=>{d.innerHTML=`<h2>Wirklich neu beginnen?</h2><p>Alle Teilnehmer, Paarungen und Ergebnisse werden gelöscht.</p><div class="dialog-actions"><button class="ghost" id="cancel-reset">Abbrechen</button><button class="danger" id="confirm-reset">Alles zurücksetzen</button></div>`;$('#cancel-reset').onclick=()=>d.close();$('#confirm-reset').onclick=()=>{state=fresh();view='setup';persist();render();d.close();toast('Neues Schleiferlturnier angelegt.')}}}
function downloadBackup(){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.href=url;a.download=`Schleiferlturnier-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}
function publicSnapshot(){const info=id=>({id,name:displayName(id),group:groupName(id[0]),color:playerColor(id)}),s=scheduleStats();return{version:1,type:'schleiferl',exportedAt:new Date().toISOString(),title:state.title,summary:{players:state.players.length,rounds:state.schedule.length,courts:s.active,results:Object.keys(state.results).length,matches:s.games,minutes:state.minutes,breakMinutes:state.breakMinutes},rounds:state.schedule.map(r=>({number:r.round,matches:r.matches.map(m=>({id:m.id,court:m.court,teams:m.teams.map(t=>t.map(info)),score:state.results[m.id]||null})),byes:r.byes.map(info)}))};}
function downloadPublicStand(){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(publicSnapshot(),null,2)],{type:'application/json'}));a.href=url;a.download='schleiferlturnierstand.json';a.hidden=true;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);const button=$('#export-public');if(button){button.textContent='✓ Export erstellt';button.classList.remove('ghost');button.classList.add('primary');setTimeout(()=>{if(button.isConnected){button.textContent='Online-Stand exportieren';button.classList.remove('primary');button.classList.add('ghost')}},2200)}toast('Online-Turnierstand exportiert. Datei schleiferlturnierstand.json im Repository ersetzen.');}
$('#import-file').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>1000000)throw new Error('Die Sicherung ist zu groß.');const imported=validate(migrate(JSON.parse(await file.text())));if(!confirm('Der aktuelle Turnierstand wird vollständig ersetzt. Fortfahren?'))return;state=imported;state.currentRound=Math.min(state.currentRound||0,Math.max(0,state.schedule.length-1));persist();view='schedule';render();toast('Sicherung eingelesen.')}catch(err){toast(err instanceof SyntaxError?'Die Datei enthält keine gültigen Daten.':err.message)}};
$('#backup').onclick=openBackup;$$('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});
try{const saved=localStorage.getItem(KEY);if(saved)state=validate(migrate(JSON.parse(saved)))}catch{}
render();
window.addEventListener('afterprint',()=>{document.body.classList.remove('printing-extra');$('#print-extra').innerHTML=''});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){updateTimer();if(state.timer.end)requestWake()}});
setInterval(updateTimer,250);
</script>
<script src="Schleiferlturnier_App.js"></script>
</body>
</html>
