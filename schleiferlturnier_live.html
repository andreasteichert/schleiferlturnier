<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Aktueller Spielplan und Ergebnisse des Schleiferlturniers.">
<title>Schleiferlturnier · Live-Stand</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23093226'/%3E%3Ccircle cx='32' cy='32' r='19' fill='%23dbf76d'/%3E%3Cpath d='M18 25c10 7 18 7 28 0M18 39c10-7 18-7 28 0' fill='none' stroke='%23093226' stroke-width='4'/%3E%3C/svg%3E">
<style>
:root{--deep:#082f24;--green:#155d43;--lime:#dafa69;--paper:#f2f5f0;--ink:#14271f;--muted:#627168;--line:#d8e2da;--white:#fff;--radius:22px;font-family:"Aptos","Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--deep);font-size:16px}
*{box-sizing:border-box}html{min-width:0}body{margin:0;min-width:0;background:var(--deep);overflow-x:hidden}body::before{content:"";position:fixed;inset:0;z-index:-2;background:url("Familienturnier_Hintergrund_Familie.png") center/cover no-repeat;filter:saturate(.75) contrast(.94)}body::after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(4,37,27,.4),rgba(4,37,27,.93) 76%)}button,.switch-link{font:inherit;cursor:pointer;min-height:46px;border:1px solid rgba(255,255,255,.2);border-radius:13px;padding:10px 16px;background:rgba(255,255,255,.1);color:#fff;font-weight:750}.switch-link{display:inline-flex;align-items:center;text-decoration:none}button:focus-visible,.switch-link:focus-visible{outline:3px solid var(--lime);outline-offset:3px}.shell{width:min(1220px,calc(100% - 48px));margin:auto}header{position:sticky;top:0;z-index:5;background:rgba(5,43,32,.95);color:#fff;border-bottom:1px solid rgba(255,255,255,.13);backdrop-filter:blur(18px)}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:17px 0}.brand{display:flex;align-items:center;gap:12px;min-width:0}.mark{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:var(--lime);color:var(--deep);font-weight:900;letter-spacing:-.08em;flex:0 0 auto}.brand h1{font-size:1.25rem;line-height:1.15;margin:0}.brand p{font-size:.84rem;color:#cbdad2;margin:4px 0 0}.header-right{display:flex;align-items:center;gap:10px}.live{display:inline-flex;align-items:center;gap:8px;font-size:.85rem;color:#deece5}.live::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 5px rgba(218,250,105,.13)}main{padding:30px 0 50px}.hero,.panel,.round{background:rgba(248,251,248,.94);border:1px solid rgba(255,255,255,.5);box-shadow:0 18px 50px rgba(3,27,19,.17);backdrop-filter:blur(17px)}.hero{border-radius:28px;padding:26px;margin-bottom:22px;display:flex;justify-content:space-between;align-items:end;gap:24px}.eyebrow{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--green);font-weight:850;margin-bottom:7px}.hero h2{font-size:clamp(1.8rem,5vw,3rem);line-height:1;letter-spacing:-.045em;margin:0}.updated{font-size:.88rem;color:var(--muted);text-align:right}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:30px}.metric{background:rgba(8,47,36,.9);color:#fff;border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:17px 18px}.metric strong{display:block;font-size:1.7rem;color:var(--lime);line-height:1}.metric span{display:block;color:#d5e4dc;font-size:.84rem;margin-top:7px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin:0 0 16px;color:#fff}.section-head h2{font-size:1.6rem;margin:0}.section-head p{margin:0;color:#d5e4dc;font-size:.9rem}.rounds{display:grid;gap:18px;margin-bottom:32px}.round{border-radius:24px;padding:21px}.round-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.round-head h3{margin:0;font-size:1.22rem}.round-state{font-size:.78rem;padding:7px 10px;border-radius:999px;background:#e6eee8;color:var(--green);font-weight:800}.round-state.done{background:#e9f6b7;color:#344d00}.matches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.match{min-width:0;border:1px solid var(--line);background:rgba(255,255,255,.8);border-radius:17px;padding:15px}.match-top{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px}.double{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0}.double+.double{border-top:1px solid #e8eee9}.players{display:grid;gap:7px;min-width:0}.player{display:flex;align-items:center;gap:8px;min-width:0;font-weight:800}.dot{width:10px;height:10px;flex:0 0 auto;border-radius:50%;background:var(--player-color,#6b7b72);box-shadow:0 0 0 3px color-mix(in srgb,var(--player-color,#6b7b72) 18%,transparent)}.player span:last-child{overflow-wrap:anywhere}.player small{font-weight:450;color:var(--muted)}.score{min-width:38px;text-align:right;font-size:1.35rem;font-weight:900;color:var(--green);font-variant-numeric:tabular-nums}.open .score{color:#849289}.byes{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}.bye{display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:10px;background:#eef2ee;font-size:.8rem}.panel{border-radius:26px;padding:22px}.empty{padding:34px;text-align:center;color:var(--muted)}.error{background:#fff0e9;color:#843a20;border:1px solid #e8c3b5;border-radius:18px;padding:18px;margin-bottom:20px}.footer{display:flex;justify-content:space-between;gap:20px;color:#ceded6;font-size:.82rem;padding:24px 2px 0}.hidden{display:none!important}
@media(max-width:900px){.matches{grid-template-columns:repeat(2,minmax(0,1fr))}.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.shell{width:min(100% - 28px,1220px)}.topbar{padding:12px 0}.mark{width:40px;height:40px}.brand h1{font-size:1rem}.brand p{font-size:.75rem}.live{display:none}button{padding:9px 12px;font-size:.85rem}.hero{padding:20px;align-items:start;flex-direction:column}.updated{text-align:left}.summary{gap:9px}.metric{padding:14px}.metric strong{font-size:1.4rem}.matches{grid-template-columns:1fr}.round{padding:16px}.panel{padding:16px}.table-wrap{overflow:visible}.standings,.standings tbody{display:block;width:100%;min-width:0}.standings thead{display:none}.standings tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;padding:14px;border-top:1px solid #e1e9e2}.standings tr:first-child{border-top:0}.standings td{display:grid;width:auto;padding:0;border:0;text-align:left;font-size:.88rem}.standings td::before{content:attr(data-label);margin-bottom:3px;color:var(--muted);font-size:.72rem;font-weight:750}.standings td:nth-child(2){grid-column:1/-1;grid-row:1}.standings td:nth-child(1){grid-row:2}.standings td:nth-child(3){grid-row:2}.standings td:nth-child(4){grid-row:3}.standings td:nth-child(5){grid-row:3}.standings td:nth-child(6){grid-row:4}.standings td:nth-child(7){grid-row:4}.standings td:nth-child(8){grid-column:1/-1;grid-row:5}.footer{flex-direction:column;gap:7px}}
@media print{header,button{display:none!important}body{background:#fff}body::before,body::after{display:none}.shell{width:100%}main{padding:0}.hero,.panel,.round{box-shadow:none;background:#fff;backdrop-filter:none}.section-head{color:var(--ink)}.section-head p,.footer{color:var(--muted)}.round{break-inside:avoid}.matches{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header><div class="shell topbar"><div class="brand"><div class="mark" aria-hidden="true">SV</div><div><h1>Schleiferlturnier</h1><p>SV Sallach · Live-Übersicht</p></div></div><div class="header-right"><span class="live">Aktueller Turnierstand</span><a class="switch-link" href="schleiferlturnier_ergebnisse.html">Tabelle</a><button id="refresh" type="button">Aktualisieren</button></div></div></header>
<main class="shell">
  <section class="hero"><div><div class="eyebrow">Spielplan & Ergebnisse</div><h2 id="title">Schleiferlturnier</h2></div><p class="updated" id="updated" role="status">Turnierstand wird geladen …</p></section>
  <div id="error" class="error hidden" role="alert"></div>
  <section class="summary" id="summary" aria-label="Turnierübersicht"></section>
  <div class="section-head"><div><div class="eyebrow" style="color:var(--lime)">Alle Runden</div><h2>Spielplan</h2></div><p id="progress"></p></div>
  <section class="rounds" id="rounds"><div class="round empty">Spielplan wird geladen …</div></section>
  <footer class="footer"><span>Nur-Lese-Ansicht · Keine Eingaben möglich</span><span>Erstellt von Andreas Teichert</span></footer>
</main>
<script>
const DATA_URL='schleiferlturnierstand.json';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function valid(d){return d&&[1,2].includes(d.version)&&d.type==='schleiferl'&&typeof d.exportedAt==='string'&&d.summary&&Array.isArray(d.rounds)&&d.rounds.every(r=>Number.isInteger(r.number)&&Array.isArray(r.matches)&&Array.isArray(r.byes));}
function timeLabel(iso){const d=new Date(iso);return Number.isNaN(d.valueOf())?'unbekannt':new Intl.DateTimeFormat('de-DE',{dateStyle:'medium',timeStyle:'short'}).format(d);}
function player(p){return `<div class="player" style="--player-color:${esc(p.color)}"><span class="dot" aria-hidden="true"></span><span>${esc(p.name)} <small>· ${esc(p.group)}</small></span></div>`}
function render(data){
  $('#error').classList.add('hidden');$('#title').textContent=data.title||'Schleiferlturnier';$('#updated').textContent=`Stand: ${timeLabel(data.exportedAt)} Uhr`;
  const s=data.summary;$('#summary').innerHTML=[[s.players,'Spieler'],[s.rounds,'Runden'],[s.courts,'Plätze'],[`${s.results}/${s.matches}`,'Ergebnisse']].map(([n,l])=>`<div class="metric"><strong>${esc(n)}</strong><span>${esc(l)}</span></div>`).join('');$('#progress').textContent=`${s.results} von ${s.matches} Ergebnissen eingetragen`;
  $('#rounds').innerHTML=data.rounds.map(round=>{const done=round.matches.filter(m=>Array.isArray(m.score)).length;return `<article class="round"><div class="round-head"><h3>Runde ${round.number}</h3><span class="round-state ${done===round.matches.length?'done':''}">${done}/${round.matches.length} Ergebnisse</span></div><div class="matches">${round.matches.map(m=>{const score=Array.isArray(m.score)?m.score:null;return `<div class="match ${score?'':'open'}"><div class="match-top"><span>Platz ${esc(m.court)}</span><span>${score?'Ergebnis':'Noch offen'}</span></div><div class="double"><div class="players">${m.teams[0].map(player).join('')}</div><div class="score">${score?esc(score[0]):'–'}</div></div><div class="double"><div class="players">${m.teams[1].map(player).join('')}</div><div class="score">${score?esc(score[1]):'–'}</div></div></div>`}).join('')}</div><div class="byes"><strong style="font-size:.8rem;padding:7px 0">Pause:</strong>${round.byes.length?round.byes.map(p=>`<span class="bye" style="--player-color:${esc(p.color)}"><span class="dot" aria-hidden="true"></span>${esc(p.name)} · ${esc(p.group)}</span>`).join(''):'<span class="bye">Niemand – alle spielen</span>'}</div></article>`}).join('')||'<div class="round empty">Noch kein Spielplan veröffentlicht.</div>';
}
async function load(){
  $('#refresh').disabled=true;
  try{const response=await fetch(`${DATA_URL}?v=${Date.now()}`,{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);const data=await response.json();if(!valid(data))throw new Error('Ungültige Daten');render(data)}
  catch(e){$('#error').textContent='Der aktuelle Turnierstand konnte nicht geladen werden. Bitte die Seite in einem Moment erneut öffnen.';$('#error').classList.remove('hidden');$('#updated').textContent='Turnierstand momentan nicht verfügbar'}
  finally{$('#refresh').disabled=false}
}
$('#refresh').onclick=load;load();setInterval(load,60000);
</script>
</body>
</html>
